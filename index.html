  <!-- Fonts: Playfair Display (serif display) + Manrope (sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // Theme-aware tokens: these CSS variables are overridden at runtime
            // by ThemeContext when the admin applies a store theme.
            // Format: "R G B" triplets so Tailwind alpha modifiers (/70, /10…) keep working.
            primary: 'rgb(var(--c-primary) / <alpha-value>)',
            secondary: 'rgb(var(--c-secondary) / <alpha-value>)',
            accent: 'rgb(var(--c-accent) / <alpha-value>)',
            sand: 'rgb(var(--c-sand) / <alpha-value>)',
            stone: 'rgb(var(--c-stone) / <alpha-value>)',
            sage: 'rgb(var(--c-sage) / <alpha-value>)',
            earth: 'rgb(var(--c-earth) / <alpha-value>)',
          },
          fontFamily: {
            sans: ['var(--font-body)'],
            serif: ['var(--font-heading)'],
          },
        }
      }
    }
  </script>

  <style>
    :root {
      /* ---- Store theme variables (overridden at runtime by ThemeContext) ---- */
      /* Tailwind color tokens as "R G B" triplets (#2B2118, #A9947A, #B7873F, #F7F1E8, #E8DDCF, #9C6B30, #5B3C27) */
      --c-primary: 43 33 24;
      --c-secondary: 169 148 122;
      --c-accent: 183 135 63;
      --c-sand: 247 241 232;
      --c-stone: 232 221 207;
      --c-sage: 156 107 48;
      --c-earth: 91 60 39;

      /* Hex mirrors + extras for plain CSS and inline styles */
      --color-primary: #2B2118;
      --color-secondary: #A9947A;
      --color-accent: #B7873F;
      --color-background: #F7F1E8;
      --color-surface: #FFFFFF;
      --color-border: #E8DDCF;
      --color-text: #2B2118;
      --color-text-muted: #7A6A58;
      --color-success: #2E7D32;
      --color-danger: #C0392B;
      --color-sage: #9C6B30;
      --color-earth: #5B3C27;

      /* Typography */
      --font-body: 'Manrope', Arial, Helvetica, sans-serif;
      --font-heading: 'Playfair Display', Georgia, serif;
      --font-size-base: 16px;
      --radius-base: 8px;

      /* Legacy aliases (kept for existing styles) */
      --bg: var(--color-background);
      --text: var(--color-text);
    }

    body {
      font-family: var(--font-body);
      font-size: var(--font-size-base);
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: var(--font-heading);
    }

    /* Soft Fade In */
    .fade-in {
      animation: fadeIn 0.8s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Subtle Hover States */
    .hover-lift {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .hover-lift:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    ::selection {
      background: rgb(var(--c-sage));
      color: #fff;
    }

    /* Global Input Styles */
    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="tel"],
    input[type="number"],
    input[type="search"],
    textarea,
    select {
      border: 1px solid rgb(var(--c-secondary)) !important;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus,
    input[type="tel"]:focus,
    input[type="number"]:focus,
    input[type="search"]:focus,
    textarea:focus,
    select:focus {
      border-color: rgb(var(--c-sage)) !important;
      box-shadow: 0 0 0 2px rgb(var(--c-sage) / 0.2) !important;
      outline: none !important;
    }
  </style>

}
</script>
