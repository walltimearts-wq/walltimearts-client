  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2B2118', // Espresso charcoal
            secondary: '#A9947A', // Aged brass taupe
            accent: '#B7873F', // Antique brass
            sand: '#F7F1E8', // Warm ivory
            stone: '#E8DDCF', // Parchment beige
            sage: '#9C6B30', // Burnished brass
            earth: '#5B3C27', // Walnut brown
          },
          fontFamily: {
            sans: ['Manrope', 'ui-sans-serif', 'system-ui', 'Arial', 'sans-serif'],
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
          },
        }
      }
    }
  </script>

  <style>
    :root {
      --bg: #F7F1E8;
      --text: #2B2118;
    }

    body {
      font-family: 'Manrope', Arial, Helvetica, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: 'Playfair Display', Georgia, serif;
    }

    /* Soft Fade In */
    .fade-in {
      animation: fadeIn 0.8s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Subtle Hover States */
    .hover-lift {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .hover-lift:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    ::selection {
      background: #9C6B30;
      color: #fff;
    }

    /* Global Input Styles */
    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="tel"],
    input[type="number"],
    input[type="search"],
    textarea,
    select {
      border: 1px solid #A9947A !important;
      /* secondary grey */
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus,
    input[type="tel"]:focus,
    input[type="number"]:focus,
    input[type="search"]:focus,
    textarea:focus,
    select:focus {
      border-color: #9C6B30 !important;
      /* sage */
      box-shadow: 0 0 0 2px rgba(143, 151, 121, 0.2) !important;
      outline: none !important;
    }
  </style>
